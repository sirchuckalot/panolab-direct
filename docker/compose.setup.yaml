# Private ISE setup service and the outbound tunnel base configuration.
# The management Compose layer routes the tunnel to the MCP manager;
# both files and the rootless overlay are required by the installer.
services:
  setup:
    container_name: panolab-direct-connect-setup-1
    # Commissioning / repair only. A pre-provisioned stopped service can
    # be started through the normal PanoLab lab_lifecycle API.
    # The manager, tunnel and licensed worker must never require it online.
    profiles: ["ise-setup"]
    build: {context: ./ise14, target: setup-runtime}
    image: panolab-direct-ise14-setup:local
    platform: linux/amd64
    user: "1000:1000"
    environment: {HOME: /work}
    volumes:
      - type: bind
        source: ${PANOLAB_ISE_TARBALL:?Installer path from launcher}
        target: /media/ise.tar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PANOLAB_CONFIG_DIR:?Required external config directory}/Xilinx.lic
        target: /licenses/Xilinx.lic
        read_only: true
        bind:
          create_host_path: false
      - ./ise14/ise-system-edition.batch:/config/ise-system-edition.batch:ro
      - type: bind
        source: ${PANOLAB_CONFIG_DIR:?Required external config directory}/mcp-bearer
        target: /run/secrets/mcp-bearer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PANOLAB_DATA_DIR:?Required external data directory}/Xilinx
        target: /opt/Xilinx
        bind:
          create_host_path: false
      - type: bind
        source: ${PANOLAB_DATA_DIR:?Required external data directory}/ise-work
        target: /work
        bind:
          create_host_path: false
    networks: [lab-backend]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  tunnel:
    container_name: panolab-direct-connect-tunnel-1
    image: ghcr.io/openai/tunnel-client:v0.0.21
    entrypoint: ["/usr/bin/tunnel-client", "run"]
    command:
      - "--control-plane.api-key=file:/run/secrets/tunnel-api-key"
      - "--mcp.server-url=http://setup:8766/mcp"
      - "--mcp.extra-headers=Authorization: file:/run/secrets/mcp-bearer"
      - "--mcp.oauth-discovery=disabled"
    user: "1000:1000"
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${PANOLAB_TUNNEL_ID:?Missing tunnel ID}
    volumes:
      - type: bind
        source: ${PANOLAB_CONFIG_DIR:?Required external config directory}/tunnel-api-key
        target: /run/secrets/tunnel-api-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PANOLAB_CONFIG_DIR:?Required external config directory}/mcp-bearer
        target: /run/secrets/mcp-bearer
        read_only: true
        bind:
          create_host_path: false
    networks: [lab-backend]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16m", "/run:rw,nosuid,nodev,size=4m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
networks:
  lab-backend: {}
