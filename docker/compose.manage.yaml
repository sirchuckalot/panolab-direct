# Management, Git gateway and restricted Docker broker services.
# Merge with compose.setup.yaml and the host rootless overlay; the latter
# overrides service UIDs for owner-only credentials and socket access.
services:
  docker-broker:
    container_name: panolab-direct-connect-docker-broker-1
    build:
      context: ./control
      dockerfile: Broker.Dockerfile
    image: panolab-direct-broker:local
    # Temporary trusted mode: execute Python directly from the mounted
    # directory. Individual file binds pin old inodes after atomic writes.
    entrypoint: ["python3", "/usr/local/lib/panolab-control/broker.py"]
    environment:
      PANOLAB_ROOTLESS_MODE: "1"
      PANOLAB_CONFIG_DIR: ${PANOLAB_CONFIG_DIR:?Required external config directory}
      PANOLAB_DATA_DIR: ${PANOLAB_DATA_DIR:?Required external data directory}
      PANOLAB_ISE_TARBALL: ${PANOLAB_ISE_TARBALL:?Required approved ISE media}
      PANOLAB_WORKSPACE_HOST: ${PANOLAB_WORKSPACE_HOST:?Missing PanoLab workspace}
      PANOLAB_REPO_HOST: ${PANOLAB_REPO_HOST:?Missing owner Git clone path}
      PANOLAB_CODEX_AUTH_HOST: ${PANOLAB_CODEX_AUTH_HOST:?Missing protected Codex auth path}
      PANOLAB_TRUSTED_MAINTENANCE: "1"
    volumes:
      - type: bind
        source: ${PANOLAB_ROOTLESS_SOCKET:?Set user rootless Docker socket}
        target: /var/run/docker.sock
      - ./modern:/source/modern:ro
      # Temporary remote-iteration mounts. Scripts are live source; Go binaries
      # still require a remotely initiated compile and controlled restart.
      - ./control:/usr/local/lib/panolab-control:ro
      - management-rpc:/rpc
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  trusted-maintenance:
    # TEMPORARY opt-in owner-trusted remote maintenance capability. This
    # container can control the laptop OWNER's rootless Docker Engine.
    # Disable/remove this profile after the remote lab is stable.
    profiles: ["trusted-maintenance"]
    build:
      context: ./control
      dockerfile: Maintenance.Dockerfile
    image: panolab-direct-trusted-maintenance:local
    container_name: panolab-direct-trusted-maintenance
    user: "0:0"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PANOLAB_CONFIG_DIR: ${PANOLAB_CONFIG_DIR:?Required external config directory}
      PANOLAB_DATA_DIR: ${PANOLAB_DATA_DIR:?Required external data directory}
      PANOLAB_TRUSTED_MAINTENANCE: "1"
      PANOLAB_ROOTLESS_SOCKET: ${PANOLAB_ROOTLESS_SOCKET:?Required rootless socket}
      PANOLAB_REPO_HOST: ${PANOLAB_REPO_HOST:?Required canonical repo}
      PANOLAB_WORKSPACE_HOST: ${PANOLAB_WORKSPACE_HOST:?Required agent workspace}
      PANOLAB_CODEX_AUTH_HOST: ${PANOLAB_CODEX_AUTH_HOST:?Required private Codex path}
      PANOLAB_ISE_TARBALL: ${PANOLAB_ISE_TARBALL:?Required approved ISE media}
    volumes:
      - type: bind
        source: ${PANOLAB_ROOTLESS_SOCKET:?Required rootless socket}
        target: /var/run/docker.sock
      - type: bind
        source: ${PANOLAB_REPO_HOST:?Required canonical repo}
        target: ${PANOLAB_REPO_HOST:?Required canonical repo}
        read_only: true
      - type: bind
        source: ${PANOLAB_CONFIG_DIR:?Required external config directory}/.env
        target: /run/panolab-compose.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PANOLAB_WORKSPACE_HOST:?Required agent workspace}
        target: /workspace
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  repo-git:
    container_name: panolab-direct-connect-repo-git-1
    build:
      context: ./control
      dockerfile: Repo.Dockerfile
    image: panolab-direct-repo-git:local
    user: "1000:1000"
    volumes:
      - ../:/repo
      - type: bind
        source: ${PANOLAB_DATA_DIR:?Required external data directory}/repo-rpc
        target: /repo-rpc
        bind:
          create_host_path: false
    networks: [lab-backend]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  manager:
    container_name: panolab-direct-connect-manager-1
    build:
      context: .
      dockerfile: control/Manager.Dockerfile
    image: panolab-direct-manager:local
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - management-rpc:/rpc
      - type: bind
        source: ${PANOLAB_DATA_DIR:?Required external data directory}/repo-rpc
        target: /repo-rpc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PANOLAB_DATA_DIR:?Required external data directory}/agent-workspace
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${PANOLAB_CONFIG_DIR:?Required external config directory}/mcp-bearer
        target: /run/secrets/mcp-bearer
        read_only: true
        bind:
          create_host_path: false
    networks: [lab-backend]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      docker-broker:
        condition: service_started
      repo-git:
        condition: service_started
  tunnel:
    command:
      - "--control-plane.api-key=file:/run/secrets/tunnel-api-key"
      - "--mcp.server-url=http://manager:8767/mcp"
      - "--mcp.extra-headers=Authorization: file:/run/secrets/mcp-bearer"
      - "--mcp.oauth-discovery=disabled"
    depends_on:
      manager:
        condition: service_started
volumes:
  management-rpc:
    external: true
    name: panolab-direct-connect_management-rpc
