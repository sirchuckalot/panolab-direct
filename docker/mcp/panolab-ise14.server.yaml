# Docker's OFFICIAL MCP Gateway custom server entry.
# Experimental until the installed ISE/license and gateway network identity are validated.
# No privileged Docker socket, shell commands, or second MCP runtime container.
name: panolab-ise14
title: PanoLab ISE 14.7 (embedded MCP)
type: server
image: panolab-direct-ise14-mcp:local
description: Legacy ISE 14.7 toolchain with a five-tool embedded MCP build service
longLived: true
command: ["mcp"]
env:
  - name: PANOLAB_MCP_TRANSPORT
    value: stdio
  - name: XILINXD_LICENSE_FILE
    value: /licenses/Xilinx.lic
volumes:
  - "{{panolab-ise14.install_path}}:/opt/Xilinx:ro"
  - "{{panolab-ise14.license_path}}:/licenses/Xilinx.lic:ro"
  - "{{panolab-ise14.results_path}}:/results:rw"
  - "{{panolab-ise14.projects_path}}:/projects:ro"
config:
  - name: panolab-ise14
    description: Private paths to owner-managed ISE installation, license and build results
    type: object
    properties:
      install_path:
        type: string
        description: Existing verified Xilinx root directory (contains 14.7/ISE_DS)
      license_path:
        type: string
        description: Existing private node-locked license path
      projects_path:
        type: string
        description: Approved read-only project manifest and RTL directory
      results_path:
        type: string
        description: Dedicated writable private results directory (explicit gateway allowlist required)
    required: [install_path, license_path, results_path, projects_path]
