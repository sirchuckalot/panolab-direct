# Overlay for the owner-user rootless Engine, merged after both base files.
# Container UID 0 maps to the ordinary laptop owner, not host root;
# this allows private 0600/0700 mounts without changing host permissions.
# The broker receives ONLY the verified user-scoped Docker socket.
services:
  setup:
    user: "0:0"
  tunnel:
    user: "0:0"
  repo-git:
    user: "0:0"
  manager:
    user: "0:0"
  docker-broker:
    environment:
      PANOLAB_ROOTLESS_MODE: "1"
    volumes:
      - type: bind
        source: ${PANOLAB_ROOTLESS_SOCKET:?Set actual rootless Docker socket}
        target: /var/run/docker.sock
